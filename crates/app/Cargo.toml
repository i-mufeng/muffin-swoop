[package]
name = "swoop-app"
description = "Swoop 下载器桌面界面（egui）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
default-run = "swoop"

[[bin]]
name = "swoop"
path = "src/main.rs"

[[bin]]
name = "swoop-cli"
path = "src/cli_main.rs"

[features]
# 开发用截图，两种方式：
# - scripts/screenshot.sh <视图>：打开指定界面（含弹窗、吐司）后截主窗口，见 src/shot.rs
# - SWOOP_RENDERER=glow EFRAME_SCREENSHOT_TO=shot.png：eframe 自带，只抓首帧（wgpu 后端不支持）
screenshot = ["eframe/glow", "eframe/__screenshot", "dep:image"]

[dependencies]
swoop-core = { workspace = true }
swoop-media = { workspace = true }
swoop-grabber = { workspace = true }
swoop-updater = { workspace = true }
swoop-i18n = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
egui_extras = { workspace = true }
egui-phosphor = { workspace = true }
tokio = { workspace = true, features = ["net"] }
tokio-util = { workspace = true }
# 浏览器桥接的本地 HTTP 服务；reqwest 已依赖 hyper 1，编译成本很小
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
percent-encoding = { workspace = true }
dirs = { workspace = true }
arboard = { version = "3.6", default-features = false }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
notify-rust = "4.17"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rfd = "0.17"
fs2 = "0.4"
uuid = { version = "1", features = ["v4"] }
reqwest = { workspace = true }
zeroize = "1"
raw-window-handle = "0.6"
# 仅截图功能用来写 PNG；与 eframe 用的是同一份
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Memory", "Win32_System_DataExchange", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.61"
tauri-winrt-notification = "0.7.3"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Console", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell"] }

# 菜单栏/托盘：Linux 版需要 GTK + libappindicator，暂只在 macOS / Windows 启用
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = { version = "0.26", default-features = false }
drag = { version = "2.1.1", default-features = false }

# 关窗驻留时切换 Dock 图标（激活策略）；版本与 tray-icon / winit 已用的一致
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSBundle", "NSString", "NSFileManager", "NSURL", "NSError"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication"] }
# 带按钮的完成通知；版本与 notify-rust 内部所用一致
mac-notification-sys = "0.6.15"

[dev-dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
reqwest = { workspace = true }
tempfile = "3"

[build-dependencies]
embed-resource = "3.0.11"
