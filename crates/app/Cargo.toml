[package]
name = "swoop-app"
description = "Swoop 下载器桌面界面（egui）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "swoop"
path = "src/main.rs"

[features]
# 开发用：SWOOP_RENDERER=glow EFRAME_SCREENSHOT_TO=shot.png 自动截图后退出（wgpu 后端不支持截图）
screenshot = ["eframe/glow", "eframe/__screenshot"]

[dependencies]
swoop-core = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
egui_extras = { workspace = true }
egui-phosphor = { workspace = true }
tokio = { workspace = true, features = ["net"] }
tokio-util = { workspace = true }
# 浏览器桥接的本地 HTTP 服务；reqwest 已依赖 hyper 1，编译成本很小
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
dirs = { workspace = true }
arboard = { version = "3.6", default-features = false }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
reqwest = { workspace = true }
tempfile = "3"
