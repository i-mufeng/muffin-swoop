[package]
name = "swoop-core"
description = "Swoop 下载引擎：多连接分段、动态分段窃取、断点续传、限速"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
swoop-ftp = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
percent-encoding = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = { workspace = true }
tracing = { workspace = true }
sha2 = "0.10"
tempfile = "3"
zeroize = "1"
curl = { version = "0.4", features = ["ntlm"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
curl = { version = "0.4", features = ["force-system-lib-on-osx"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Security_Credentials"] }

[target.'cfg(windows)'.dependencies.curl]
version = "0.4"
features = ["spnego"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }
