<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Swoop</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    body { width: 300px; padding: 14px; display: grid; gap: 10px; }
    .result-title { font-weight: 600; }
    .result.err .result-title { color: var(--danger); }
    .result.ok .result-title { color: var(--success); }
    .small { font-size: 12px; }
    #status-sub { white-space: normal; }
    a { color: var(--accent); text-decoration: none; cursor: pointer; }
  </style>
</head>
<body>
  <div class="row">
    <img src="icons/icon-32.png" width="20" height="20" alt="">
    <h1>Swoop</h1>
    <span class="spacer"></span>
    <a id="open-welcome" class="small" data-i18n="使用指南">使用指南</a>
    <a id="open-options" class="small" data-i18n="设置">设置</a>
  </div>

  <div class="card row">
    <span id="dot" class="dot"></span>
    <div class="ellipsis" style="flex: 1">
      <div id="status" data-i18n="检测中…">检测中…</div>
      <div id="status-sub" class="muted small"></div>
    </div>
  </div>

  <label class="card row">
    <div style="flex: 1">
      <div data-i18n="接管浏览器下载">接管浏览器下载</div>
      <div class="muted small" data-i18n="关闭后下载完全交给浏览器">关闭后下载完全交给浏览器</div>
    </div>
    <span class="switch"><input id="enabled" type="checkbox"><span></span></span>
  </label>

  <button id="collect-page" class="primary" data-i18n="下载本页链接…">下载本页链接…</button>
  <button id="open-media" data-i18n="网页媒体…">网页媒体…</button>
  <div id="collect-error" class="muted small" role="status"></div>

  <div id="result" class="card result" hidden>
    <div id="result-title" class="result-title small"></div>
    <div id="result-name" class="ellipsis"></div>
    <div id="result-detail" class="muted small"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
