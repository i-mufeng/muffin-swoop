<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swoop — 方案 B · 墨黑</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --ink: #f4f4f5;
    --dim: #8b8e98;
    --accent: #34d399;
    --hairline: rgba(244,244,245,.1);
    --mono: "Cascadia Code", Consolas, monospace;
  }
  body {
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0a0a0b url(assets/bg-min-dark.png) center / cover no-repeat fixed;
    color: var(--ink);
    min-height: 100vh;
    overflow: hidden;
  }
  nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 56px; height: 72px;
    border-bottom: 1px solid var(--hairline);
  }
  .logo { font-family: var(--mono); font-size: 17px; font-weight: 700; letter-spacing: 1px; }
  .logo span { color: var(--accent); }
  .nav-links { display: flex; gap: 32px; align-items: center; font-size: 14px; }
  .nav-links a { color: var(--dim); text-decoration: none; }
  .nav-links a:hover { color: var(--ink); }
  .theme-toggle {
    width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--hairline);
    background: transparent; display: grid; place-items: center; font-size: 14px; cursor: pointer; color: var(--ink);
  }
  main {
    height: calc(100vh - 72px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 0 24px;
  }
  .ver {
    font-family: var(--mono); font-size: 13px; color: var(--accent);
    border: 1px solid rgba(52,211,153,.3); border-radius: 999px; padding: 7px 18px;
    background: rgba(52,211,153,.06);
  }
  h1 { margin-top: 32px; font-size: 72px; font-weight: 700; letter-spacing: -2px; line-height: 1.15; }
  h1 span { color: var(--dim); }
  .tagline { margin-top: 24px; font-size: 16.5px; color: var(--dim); line-height: 1.9; max-width: 540px; }
  .cta { margin-top: 46px; display: flex; gap: 14px; align-items: center; }
  .btn-primary {
    padding: 15px 36px; border-radius: 10px; border: none; cursor: pointer;
    font-size: 15px; font-weight: 600; color: #06251b; background: var(--accent);
    transition: filter .2s;
  }
  .btn-primary:hover { filter: brightness(1.1); }
  .btn-ghost {
    padding: 14px 28px; border-radius: 10px; cursor: pointer;
    font-size: 14.5px; font-weight: 500; color: var(--ink);
    background: transparent; border: 1px solid var(--hairline);
  }
  .meta {
    margin-top: 60px; display: flex; gap: 36px;
    font-family: var(--mono); font-size: 12.5px; color: var(--dim);
  }
  .meta a { color: var(--accent); text-decoration: none; }
  .meta a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <nav>
    <div class="logo">swoop<span>.</span></div>
    <div class="nav-links">
      <a href="#">功能</a><a href="#">下载</a><a href="#">文档</a><a href="#">GitHub</a>
      <button class="theme-toggle">☀</button>
    </div>
  </nav>
  <main>
    <div class="ver">v1.2.0 · latest release</div>
    <h1>快，而且<span>恰到好处</span>。</h1>
    <p class="tagline">Rust 编写的多线程下载管理器：分段加速、断点续传、流媒体录制、整站镜像，一个小巧二进制，没有多余的一切。</p>
    <div class="cta">
      <button class="btn-primary">↓ 下载 Windows 版</button>
      <button class="btn-ghost">macOS 版</button>
    </div>
    <div class="meta">
      <span>cdn.muffin.xin</span>
      <a href="#">github releases →</a>
      <span>MIT</span>
    </div>
  </main>
</body>
</html>
