<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swoop — 方案 A · 星际极速</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --accent: #38bdf8;
    --accent-2: #818cf8;
    --text: #eaf2ff;
    --text-dim: #9db4d8;
  }
  body {
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #040918 url(assets/bg-a-velocity.png) center / cover no-repeat fixed;
    color: var(--text);
    min-height: 100vh;
    overflow: hidden;
  }
  nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 28px 64px;
  }
  .logo { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 700; letter-spacing: 1px; }
  .logo-dot { width: 34px; height: 34px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center; font-size: 18px; color: #04101f; font-weight: 900;
    box-shadow: 0 0 24px rgba(56,189,248,.55); }
  .nav-links { display: flex; gap: 36px; align-items: center; font-size: 14px; color: var(--text-dim); }
  .nav-links a { color: inherit; text-decoration: none; transition: color .2s; }
  .nav-links a:hover { color: var(--text); }
  .theme-toggle {
    width: 56px; height: 30px; border-radius: 999px; border: 1px solid rgba(157,180,216,.35);
    background: rgba(10,20,40,.6); position: relative; cursor: pointer;
  }
  .theme-toggle::after {
    content: "🌙"; position: absolute; top: 3px; left: 4px; width: 22px; height: 22px;
    border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center; font-size: 11px;
  }
  main {
    height: calc(100vh - 90px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 0 24px; margin-top: -40px;
  }
  .badge {
    display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid rgba(56,189,248,.4); border-radius: 999px;
    padding: 7px 18px; font-size: 13px; color: var(--accent);
    background: rgba(56,189,248,.08); backdrop-filter: blur(6px);
    box-shadow: 0 0 20px rgba(56,189,248,.15) inset;
  }
  .badge .pulse { width: 7px; height: 7px; border-radius: 50%; background: #34d399; box-shadow: 0 0 8px #34d399; }
  h1 {
    margin-top: 28px; font-size: 84px; font-weight: 800; letter-spacing: 2px; line-height: 1.05;
    background: linear-gradient(120deg, #ffffff 20%, var(--accent) 60%, var(--accent-2) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 60px rgba(56,189,248,.25);
  }
  .tagline { margin-top: 20px; font-size: 20px; color: var(--text-dim); max-width: 620px; line-height: 1.7; }
  .tagline b { color: var(--text); font-weight: 600; }
  .cta { margin-top: 44px; display: flex; gap: 18px; align-items: center; }
  .btn-primary {
    padding: 16px 42px; border-radius: 14px; border: none; cursor: pointer;
    font-size: 16px; font-weight: 700; color: #04101f; letter-spacing: .5px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 8px 40px rgba(56,189,248,.45), 0 0 0 1px rgba(255,255,255,.15) inset;
    transition: transform .15s;
  }
  .btn-primary:hover { transform: translateY(-2px); }
  .btn-ghost {
    padding: 15px 34px; border-radius: 14px; cursor: pointer;
    font-size: 15px; font-weight: 600; color: var(--text);
    background: rgba(10,22,44,.55); border: 1px solid rgba(157,180,216,.3);
    backdrop-filter: blur(8px);
  }
  .meta { margin-top: 34px; display: flex; gap: 28px; font-size: 13px; color: var(--text-dim); }
  .meta span { display: flex; align-items: center; gap: 6px; }
  .meta a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
  <nav>
    <div class="logo"><div class="logo-dot">S</div>Swoop</div>
    <div class="nav-links">
      <a href="#">功能特性</a><a href="#">下载</a><a href="#">文档</a><a href="#">GitHub</a>
      <div class="theme-toggle"></div>
    </div>
  </nav>
  <main>
    <div class="badge"><span class="pulse"></span>v1.2.0 最新版已发布 · 支持断点续传</div>
    <h1>极速下载<br>一触即发</h1>
    <p class="tagline">基于 <b>Rust</b> 打造的多线程下载管理器 —— 多连接分段加速、流媒体录制、整站镜像，<b>一个小巧二进制</b>全部搞定。</p>
    <div class="cta">
      <button class="btn-primary">⬇&nbsp;&nbsp;立即下载 · Windows</button>
      <button class="btn-ghost">macOS 版本</button>
    </div>
    <div class="meta">
      <span>📦 cdn.muffin.xin 高速下载</span>
      <span>·</span>
      <span><a href="#">GitHub Releases →</a></span>
      <span>·</span>
      <span>MIT 开源</span>
    </div>
  </main>
</body>
</html>
